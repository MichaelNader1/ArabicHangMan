<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة التخمين</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* ==========================================
           START SCREEN
        ========================================== */
        .start-screen {
            text-align: center;
            color: white;
            animation: fadeIn 1s ease-in;
        }

        .start-screen.hidden {
            display: none;
        }

        .mystery-icon {
            font-size: 120px;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
        }

        .start-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 20px rgba(0, 0, 0, 0.3);
        }

        .start-subtitle {
            font-size: 22px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .start-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            padding: 20px 60px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(245, 87, 108, 0.4);
            transition: all 0.3s ease;
            transform: translateY(0);
        }

        .start-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(245, 87, 108, 0.6);
        }

        /* ==========================================
           GAME CONTAINER
        ========================================== */
        .game-container {
            display: none;
            max-width: 1200px;
            width: 95%;
            animation: slideIn 0.6s ease-out;
        }

        .game-container.active {
            display: block;
        }

        .game-header {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px 20px 0 0;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .game-title {
            font-size: 32px;
            font-weight: bold;
        }

        .mistakes-counter {
            font-size: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 25px;
            border-radius: 25px;
        }

        .mistakes-number {
            color: #ff6b6b;
            font-weight: bold;
            font-size: 24px;
        }

        .game-board {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 0 0 20px 20px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .main-area {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
        }

        /* ==========================================
           HANGMAN DRAWING (SVG)
        ========================================== */
        .hangman-area {
            flex: 1;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 20px;
            padding: 30px;
            min-height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .hangman-svg {
            width: 250px;
            height: 400px;
        }

        /* SVG Animation Classes */
        .svg-part {
            opacity: 0;
            transform-origin: center;
        }

        .svg-part.visible {
            opacity: 1;
            animation: drawPart 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes drawPart {
            from {
                opacity: 0;
                transform: scale(0);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ==========================================
           LETTERS AREA
        ========================================== */
        .letters-area {
            flex: 1;
        }

        .letters-title {
            font-size: 22px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .letters-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .letter-btn {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            transform: translateY(0);
        }

        .letter-btn:hover:not(.clicked) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
        }

        .letter-btn.clicked {
            background: #95a5a6;
            cursor: not-allowed;
            opacity: 0.4;
            transform: scale(0.9);
        }

        .letter-btn.correct {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            animation: correctPulse 0.5s ease;
        }

        .letter-btn.wrong {
            background: linear-gradient(135deg, #d63031 0%, #e17055 100%);
            animation: wrongShake 0.5s ease;
        }

        /* ==========================================
           WORD DISPLAY
        ========================================== */
        .word-display {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 30px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 20px;
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.1);
            min-height: 120px;
            align-items: center;
        }

        .word-letter {
            width: 50px;
            height: 60px;
            border-bottom: 4px solid #667eea;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: #2d3436;
            background: white;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .word-letter.revealed {
            animation: revealLetter 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            color: #667eea;
        }

        .word-letter.space {
            border: none;
            background: transparent;
            box-shadow: none;
            width: 20px;
        }

        /* ==========================================
           MODAL/POPUP
        ========================================== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            color: white;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: modalSlide 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .modal-content.lose {
            background: linear-gradient(135deg, #d63031 0%, #e17055 100%);
        }

        .modal-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .modal-message {
            font-size: 24px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .modal-quote {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            font-size: 22px;
            margin-bottom: 30px;
            font-style: italic;
            line-height: 1.8;
        }

        .modal-button {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.3);
        }

        .modal-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.4);
        }

        .modal-content.lose .modal-button {
            color: #d63031;
        }

        /* ==========================================
           ANIMATIONS
        ========================================== */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes correctPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        @keyframes wrongShake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        @keyframes revealLetter {
            0% {
                transform: rotateY(90deg) scale(0.5);
                opacity: 0;
            }

            100% {
                transform: rotateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes modalSlide {
            from {
                transform: scale(0.5) translateY(-100px);
                opacity: 0;
            }

            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        /* ==========================================
           RESPONSIVE
        ========================================== */
        @media (max-width: 768px) {
            .main-area {
                flex-direction: column;
            }

            .letters-grid {
                grid-template-columns: repeat(6, 1fr);
            }

            .start-title {
                font-size: 32px;
            }

            .modal-content {
                padding: 30px;
                margin: 20px;
            }

            .hangman-svg {
                width: 200px;
                height: 350px;
            }
        }
    </style>
</head>

<body>
    <!-- ==========================================
         START SCREEN
    ========================================== -->
    <div class="start-screen" id="startScreen">
        <div class="mystery-icon">🤔💭</div>
        <h1 class="start-title">لعبة التخمين</h1>
        <p class="start-subtitle">خمّن الكلمة قبل ما الوقت ينتهي!</p>
        <button class="start-button" id="startButton">ابدأ اللعب 🎮</button>
    </div>

    <!-- ==========================================
         GAME CONTAINER
    ========================================== -->
    <div class="game-container" id="gameContainer">
        <div class="game-header">
            <div class="game-title">لعبة التخمين 🎯</div>
            <div class="mistakes-counter">
                أخطاء: <span class="mistakes-number" id="mistakesCount">0</span> / 6
            </div>
        </div>

        <div class="game-board">
            <div class="main-area">
                <!-- Hangman Drawing Area (SVG) -->
                <div class="hangman-area">
                    <svg class="hangman-svg" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
                        <!-- Static Structure (Always Visible) -->
                        <!-- Base -->
                        <rect x="10" y="280" width="180" height="8" fill="#2d3436" rx="4" />

                        <!-- Vertical Pole -->
                        <rect x="40" y="20" width="8" height="260" fill="#2d3436" rx="4" />

                        <!-- Top Beam -->
                        <rect x="40" y="20" width="100" height="8" fill="#2d3436" rx="4" />

                        <!-- Rope -->
                        <line x1="140" y1="28" x2="140" y2="60" stroke="#8b4513" stroke-width="3" />

                        <!-- Dynamic Parts (Drawn on Wrong Guesses) -->
                        <!-- 1. Head -->
                        <circle id="head" class="svg-part" cx="140" cy="80" r="20" fill="none" stroke="#ff6b6b"
                            stroke-width="4" />

                        <!-- 2. Body -->
                        <line id="body" class="svg-part" x1="140" y1="100" x2="140" y2="160" stroke="#ff6b6b"
                            stroke-width="4" />

                        <!-- 3. Right Arm -->
                        <line id="rightArm" class="svg-part" x1="140" y1="120" x2="170" y2="140" stroke="#ff6b6b"
                            stroke-width="4" />

                        <!-- 4. Left Arm -->
                        <line id="leftArm" class="svg-part" x1="140" y1="120" x2="110" y2="140" stroke="#ff6b6b"
                            stroke-width="4" />

                        <!-- 5. Right Leg -->
                        <line id="rightLeg" class="svg-part" x1="140" y1="160" x2="165" y2="200" stroke="#ff6b6b"
                            stroke-width="4" />

                        <!-- 6. Left Leg -->
                        <line id="leftLeg" class="svg-part" x1="140" y1="160" x2="115" y2="200" stroke="#ff6b6b"
                            stroke-width="4" />
                    </svg>
                </div>

                <!-- Letters Selection Area -->
                <div class="letters-area">
                    <div class="letters-title">اختار الحروف ⌨️</div>
                    <div class="letters-grid" id="lettersGrid"></div>
                </div>
            </div>

            <!-- Word Display Area -->
            <div class="word-display" id="wordDisplay"></div>
        </div>
    </div>

    <!-- ==========================================
         MODAL
    ========================================== -->
    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent">
            <div class="modal-icon" id="modalIcon">🎉</div>
            <h2 class="modal-title" id="modalTitle">رائع!</h2>
            <p class="modal-message" id="modalMessage">لقد فزت!</p>
            <div class="modal-quote" id="modalQuote"></div>
            <button class="modal-button" id="modalButton">التالي</button>
        </div>
    </div>

    <script>
        // ==========================================
        // DATA & CONFIGURATION
        // ==========================================

        // Complete Arabic alphabet including all hamza forms
        const arabicLetters = [
            'ا', 'أ', 'إ', 'آ', 'ء',  // Alef and hamza variations
            'ب', 'ت', 'ث', 'ج', 'ح', 'خ',
            'د', 'ذ', 'ر', 'ز', 'س', 'ش', 'ص',
            'ض', 'ط', 'ظ', 'ع', 'غ', 'ف', 'ق',
            'ك', 'ل', 'م', 'ن', 'ه', 'و',
            'ؤ', 'ئ',  // Hamza on waw and yaa
            'ي', 'ى', 'ة'  // Yaa, alef maksura, taa marbuta
        ];

        // Game data with words and quotes
        const gameData = [
            {
                word: "اجبية",
                category: "عامة",
                quote: ""
            },
            {
                word: "دفنار",
                category: "عامة",
                quote: " "
            },
            {
                word: "الروح القدس",
                category: "عامة",
                quote: " "
            },
            {
                word: "الدسقولية",
                category: "عامة",
                quote: ""
            },
            {
                word: "حكمة سليمان",
                category: "عامة",
                quote: ""
            },
            {
                word: "محبة فرح سلام",
                category: "عامة",
                quote: ""
            },
            {
                word: "راعوث المؤابية",
                category: "عامة",
                quote: ""
            },
            {
                word: "مريم المجدلية",
                category: "عامة",
                quote: ""
            },
            {
                word: "مرثا ومريم",
                category: "عامة",
                quote: ""
            },
            {
                word: "فداء",
                category: "عامة",
                quote: ""
            },
            {
                word: "التوراة",
                category: "عامة",
                quote: ""
            },
            {
                word: "تسبيح",
                category: "عامة",
                quote: ""
            },
            {
                word: "قداسة",
                category: "عامة",
                quote: ""
            },
            {
                word: "العهد القديم",
                category: "عامة",
                quote: ""
            },
            {
                word: "دابورة النبية",
                category: "عامة",
                quote: ""
            },
            {
                word: "العذراء مريم",
                category: "عامة",
                quote: ""
            },
            {
                word: "السيد المسيح",
                category: "عامة",
                quote: ""
            },
            {
                word: "خميس العهد",
                category: "عامة",
                quote: ""
            },
            {
                word: "توبة",
                category: "عامة",
                quote: ""
            },
            {
                word: "كنيسة",
                category: "عامة",
                quote: ""
            }
        ];


        // Hangman body parts in correct order
        const bodyParts = ['head', 'body', 'rightArm', 'leftArm', 'rightLeg', 'leftLeg'];
        const MAX_MISTAKES = 6;

        // ==========================================
        // GAME STATE
        // ==========================================

        let currentWordIndex = 0;
        let currentWord = '';
        let currentQuote = '';
        let guessedLetters = [];
        let wrongAttempts = 0;
        let gameActive = false;

        // ==========================================
        // DOM ELEMENTS
        // ==========================================

        const startScreen = document.getElementById('startScreen');
        const gameContainer = document.getElementById('gameContainer');
        const startButton = document.getElementById('startButton');
        const lettersGrid = document.getElementById('lettersGrid');
        const wordDisplay = document.getElementById('wordDisplay');
        const mistakesCount = document.getElementById('mistakesCount');
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modalContent');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalQuote = document.getElementById('modalQuote');
        const modalButton = document.getElementById('modalButton');

        // ==========================================
        // UTILITY FUNCTIONS
        // ==========================================

        /**
         * Normalize Arabic letter for comparison
         * Treats all hamza variations as equivalent for matching
         */
        function normalizeArabicLetter(letter) {
            const hamzaVariations = {
                'أ': 'ا', 'إ': 'ا', 'آ': 'ا', 'ء': 'ا',
                'ؤ': 'و', 'ئ': 'ي', 'ى': 'ي', 'ة': 'ه'
            };
            return hamzaVariations[letter] || letter;
        }

        /**
         * Check if a guessed letter matches a word letter
         * Handles hamza variations properly
         */
        function lettersMatch(guessedLetter, wordLetter) {
            return normalizeArabicLetter(guessedLetter) === normalizeArabicLetter(wordLetter);
        }

        // ==========================================
        // INITIALIZATION
        // ==========================================

        function init() {
            startButton.addEventListener('click', startGame);
            modalButton.addEventListener('click', handleModalButton);
            createLetterButtons();
        }

        /**
         * Create letter selection buttons
         */
        function createLetterButtons() {
            lettersGrid.innerHTML = '';
            arabicLetters.forEach(letter => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.textContent = letter;
                btn.addEventListener('click', () => handleLetterClick(letter, btn));
                lettersGrid.appendChild(btn);
            });
        }

        // ==========================================
        // GAME FLOW
        // ==========================================

        function startGame() {
            startScreen.classList.add('hidden');
            gameContainer.classList.add('active');
            loadNextWord();
        }

        function loadNextWord() {
            // Check if all words have been played
            if (currentWordIndex >= gameData.length) {
                showFinalMessage();
                return;
            }

            // Load current word data
            const wordData = gameData[currentWordIndex];
            currentWord = wordData.word;
            currentQuote = wordData.quote;

            // Reset game state
            guessedLetters = [];
            wrongAttempts = 0;
            gameActive = true;

            // Reset UI
            resetHangman();
            resetLetterButtons();
            createWordDisplay();
            updateMistakesCounter();
        }

        /**
         * Create word display with letter slots
         */
        function createWordDisplay() {
            wordDisplay.innerHTML = '';

            for (let i = 0; i < currentWord.length; i++) {
                const span = document.createElement('span');

                if (currentWord[i] === ' ') {
                    span.className = 'word-letter space';
                } else {
                    span.className = 'word-letter';
                    span.dataset.letter = currentWord[i];
                }

                wordDisplay.appendChild(span);
            }
        }

        function resetHangman() {
            bodyParts.forEach(partId => {
                const part = document.getElementById(partId);
                part.classList.remove('visible');
            });
        }

        function resetLetterButtons() {
            const buttons = document.querySelectorAll('.letter-btn');
            buttons.forEach(btn => {
                btn.classList.remove('clicked', 'correct', 'wrong');
                btn.disabled = false;
            });
        }

        function updateMistakesCounter() {
            mistakesCount.textContent = wrongAttempts;
        }

        // ==========================================
        // GAME LOGIC
        // ==========================================

        function handleLetterClick(letter, button) {
            if (!gameActive || button.disabled) {
                return;
            }

            // Disable button immediately
            button.classList.add('clicked');
            button.disabled = true;

            // Check if letter is in word (using normalized comparison)
            let isCorrect = false;

            for (let i = 0; i < currentWord.length; i++) {
                if (lettersMatch(letter, currentWord[i])) {
                    isCorrect = true;
                    break;
                }
            }

            if (isCorrect) {
                handleCorrectGuess(letter, button);
            } else {
                handleWrongGuess(button);
            }
        }

        function handleCorrectGuess(letter, button) {
            button.classList.add('correct');
            guessedLetters.push(letter);

            // Reveal all matching letters in word display
            const letterSpans = document.querySelectorAll('.word-letter');

            letterSpans.forEach(span => {
                if (span.dataset.letter && lettersMatch(letter, span.dataset.letter)) {
                    span.textContent = span.dataset.letter; // Show original letter
                    span.classList.add('revealed');
                }
            });

            // Check for win after a short delay
            setTimeout(() => {
                checkWin();
            }, 500);
        }

        function handleWrongGuess(button) {
            button.classList.add('wrong');
            wrongAttempts++;
            updateMistakesCounter();

            // Draw next body part
            if (wrongAttempts <= MAX_MISTAKES) {
                const partToShow = bodyParts[wrongAttempts - 1];
                const element = document.getElementById(partToShow);

                setTimeout(() => {
                    element.classList.add('visible');
                }, 100);
            }

            // Check for game over
            if (wrongAttempts >= MAX_MISTAKES) {
                gameActive = false;
                setTimeout(() => {
                    gameOver();
                }, 800);
            }
        }

        function checkWin() {
            const letterSpans = document.querySelectorAll('.word-letter:not(.space)');
            const allRevealed = Array.from(letterSpans).every(span => span.textContent !== '');

            if (allRevealed) {
                gameActive = false;
                setTimeout(() => {
                    showWinModal();
                }, 500);
            }
        }

        function gameOver() {
            showLoseModal();
        }

        // ==========================================
        // MODALS
        // ==========================================

        function showWinModal() {
            modalContent.classList.remove('lose');
            modalIcon.textContent = '🎉';
            modalTitle.textContent = 'مبروك! 🎊';
            modalMessage.textContent = `عظيم! عرفت الكلمة: ${currentWord}`;
            modalQuote.textContent = currentQuote;
            modalQuote.style.display = 'block';
            modalButton.textContent = currentWordIndex < gameData.length - 1 ? 'الكلمة التالية ⬅️' : 'خلصت الكلمات 🏆';
            modal.classList.add('active');
        }

        function showLoseModal() {
            modalContent.classList.add('lose');
            modalIcon.textContent = '😔';
            modalTitle.textContent = 'للأسف!';
            modalMessage.textContent = `الكلمة كانت: ${currentWord}`;
            modalQuote.style.display = 'none';
            modalButton.textContent = currentWordIndex < gameData.length - 1 ? 'حاول تاني 🔄' : 'خلصت الكلمات';
            modal.classList.add('active');
        }

        function showFinalMessage() {
            modalContent.classList.remove('lose');
            modalIcon.textContent = '🏆';
            modalTitle.textContent = 'انتهت اللعبة!';
            modalMessage.textContent = 'تمام! خلصت كل الكلمات المتاحة 🎯';
            modalQuote.style.display = 'none';
            modalButton.textContent = 'ابدأ من الأول 🔄';
            modal.classList.add('active');
        }

        function handleModalButton() {
            modal.classList.remove('active');

            // Check if game is finished
            if (currentWordIndex >= gameData.length) {
                // Restart from beginning
                currentWordIndex = 0;
                gameContainer.classList.remove('active');
                startScreen.classList.remove('hidden');
            } else {
                // Move to next word
                currentWordIndex++;
                loadNextWord();
            }
        }

        // ==========================================
        // START APPLICATION
        // ==========================================

        init();
    </script>

</body>

</html>
